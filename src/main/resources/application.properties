# Local default is a file-backed H2 database so the API runs without MySQL.
# Point SPRING_DATASOURCE_URL at MySQL to use an external database instead.
spring.datasource.url=jdbc:h2:file:./data/cusr;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Mail is optional. Booking still succeeds when SMTP is not configured.
# Set SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, and SPRING_MAIL_PASSWORD to send real mail.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
cusr.mail.from=${CUSR_MAIL_FROM:noreply@localhost}
